name: Linux preview

on:
  workflow_dispatch:
  push:
    branches: [feat/linux-builds-0.12.6]

permissions:
  contents: read

concurrency:
  group: linux-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential pkg-config binutils patchelf xdg-utils xvfb dbus-x11
          npm install --global pnpm@11.25.0
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and JavaScript tests
        run: |
          pnpm format:check
          pnpm test
          bash -n scripts/build-linux.sh
      - name: Build frontend and test Rust
        run: |
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build and verify the Debian package
        run: bash scripts/build-linux.sh --output-dir "$PWD/work/linux-release"
      - name: Verify native and frontend startup from extracted package
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          dpkg-deb --extract work/linux-release/lector-libre_0.12.6_amd64.deb work/linux-extracted
          xvfb-run -a dbus-run-session -- python3 scripts/check-linux-startup.py work/linux-extracted/usr/bin/lector-libre
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lector-libre-0.12.6-Linux-amd64
          path: work/linux-release/
          if-no-files-found: error
          retention-days: 14
