[package]
name = "lector-libre"
version = "0.12.2"
edition = "2021"
license = "MIT"

[lib]
name = "lector_libre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
drive-sync = []

[dependencies]
tauri-plugin-reader-mobile = { path = "../native/mobile" }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-fs = "2"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "blocking", "rustls-tls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }
